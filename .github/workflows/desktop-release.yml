name: Desktop prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    name: Verify desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop-app/package-lock.json
            desktop-app/vendors/ai-sdk-provider-codex-asp/package-lock.json

      - name: Install Codex CLI
        shell: bash
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          codex_bin="$(find "$HOME" -type f -name codex -perm -111 -print -quit)"
          if [ -z "$codex_bin" ]; then
            echo "Codex CLI was not installed." >&2
            exit 1
          fi
          codex_dir="$(dirname "$codex_bin")"
          echo "$codex_dir" >> "$GITHUB_PATH"
          "$codex_bin" --version

      - name: Install provider dependencies
        run: npm ci
        working-directory: desktop-app/vendors/ai-sdk-provider-codex-asp

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Generate Codex app-server protocol types
        run: npm run codex:generate-types
        working-directory: desktop-app/vendors/ai-sdk-provider-codex-asp

      - name: Provider lint, typecheck, and tests
        working-directory: desktop-app/vendors/ai-sdk-provider-codex-asp
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Desktop lint, typecheck, and tests
        working-directory: desktop-app
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Verify test-plan coverage contract
        env:
          DASCOWORK_E2E_ALLOW_UNSANDBOXED_COMMANDS: '1'
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:plan-coverage

      - name: Run Mock E2E
        env:
          DASCOWORK_E2E_ALLOW_UNSANDBOXED_COMMANDS: '1'
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e -- --reporter=line

      - name: Run packaged smoke
        env:
          DASCOWORK_E2E_ALLOW_UNSANDBOXED_COMMANDS: '1'
        run: xvfb-run --auto-servernum npm --prefix desktop-app run test:e2e:packaged

      - name: Check change scope
        shell: bash
        run: |
          base="$(git rev-parse HEAD^)"
          git diff --check "$base" HEAD
          if git diff --name-only "$base" HEAD -- codex/codex-rs/app-server | grep -q .; then
            echo "Changes to codex/codex-rs/app-server are outside this project boundary." >&2
            exit 1
          fi

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-playwright-diagnostics
          if-no-files-found: ignore
          path: |
            desktop-app/test-results
            desktop-app/playwright-report

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64 DMG
            os: macos-13
            command: build:mac
            arch: x64
            artifact: desktop-macos-x64
            pattern: desktop-app/dist/*.dmg
          - name: macOS arm64 DMG
            os: macos-14
            command: build:mac
            arch: arm64
            artifact: desktop-macos-arm64
            pattern: desktop-app/dist/*.dmg
          - name: Windows x64 NSIS
            os: windows-latest
            command: build:win
            arch: x64
            artifact: desktop-windows-x64
            pattern: desktop-app/dist/*.exe
          - name: Linux x64 AppImage deb snap
            os: ubuntu-latest
            command: build:linux
            arch: x64
            artifact: desktop-linux-x64
            pattern: |
              desktop-app/dist/*.AppImage
              desktop-app/dist/*.deb
              desktop-app/dist/*.snap

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop-app/package-lock.json
            desktop-app/vendors/ai-sdk-provider-codex-asp/package-lock.json

      - name: Install provider dependencies
        run: npm ci
        working-directory: desktop-app/vendors/ai-sdk-provider-codex-asp

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-app

      - name: Install Codex CLI
        shell: bash
        run: |
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          codex_bin="$(find "$HOME" -type f -name codex -perm -111 -print -quit)"
          if [ -z "$codex_bin" ]; then
            echo "Codex CLI was not installed." >&2
            exit 1
          fi
          codex_dir="$(dirname "$codex_bin")"
          echo "$codex_dir" >> "$GITHUB_PATH"
          "$codex_bin" --version

      - name: Generate Codex app-server protocol types
        run: npm run codex:generate-types
        working-directory: desktop-app/vendors/ai-sdk-provider-codex-asp

      - name: Build installer
        run: npm run ${{ matrix.command }} -- --${{ matrix.arch }}
        working-directory: desktop-app

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.pattern }}

  release:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          find release-assets -maxdepth 1 -type f -print
          dmg_count="$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')"
          exe_count="$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l | tr -d ' ')"
          appimage_count="$(find release-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l | tr -d ' ')"
          deb_count="$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')"
          snap_count="$(find release-assets -maxdepth 1 -type f -name '*.snap' | wc -l | tr -d ' ')"
          test "$dmg_count" -eq 2
          test "$exe_count" -eq 1
          test "$appimage_count" -eq 1
          test "$deb_count" -eq 1
          test "$snap_count" -eq 1

      - name: Create or update GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: main-${{ github.sha }}
        shell: bash
        run: |
          release_notes="$(printf '%s\n\n%s\n\n%s\n' \
            "Automated test prerelease for commit ${GITHUB_SHA}." \
            "These installers are prebuilt test artifacts from the main branch. macOS builds are not notarized and Windows builds are not signed, so first launch may show operating system security prompts." \
            "This release does not include API keys, Codex login state, or backend credentials. The installed app requires the user's local Codex CLI to be installed, logged in, and visible on PATH."
          )"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$release_notes" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$release_notes" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

          gh release upload "$RELEASE_TAG" release-assets/* --clobber
