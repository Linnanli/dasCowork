<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">dasCowork Codex 风格右侧工作区 UI 设计板</title>
  <desc id="desc">入口、多标签终端、文件、浏览器和审阅五种右侧工作区状态的深色界面线框图。</desc>
  <defs>
    <style>
      .board { fill: #0d0d0d; }
      .frame { fill: #151515; stroke: #343434; stroke-width: 1; }
      .surface { fill: #202020; }
      .surface2 { fill: #292929; }
      .line { stroke: #343434; stroke-width: 1; }
      .text { fill: #f2f2f2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #989898; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #dedede; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
      .label { fill: #b6b6b6; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 15px; font-weight: 650; letter-spacing: .04em; }
      .small { font-size: 13px; }
      .body { font-size: 16px; }
      .title { font-size: 21px; font-weight: 650; }
      .green { fill: #42d98b; }
      .red { fill: #ff5f65; }
      .blue { fill: #63a5ff; }
      .icon { fill: none; stroke: #bdbdbd; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect class="board" width="1600" height="1180"/>
  <text class="text" x="48" y="50" font-size="26" font-weight="700">Codex 风格右侧工作区 · UI 设计基线</text>
  <text class="muted" x="48" y="78" font-size="14">深色模式主基线 · 使用现有语义色 token · 所有数值为实现验收尺寸</text>

  <!-- A: Launcher -->
  <text class="label" x="48" y="124">A · 无标签入口</text>
  <g filter="url(#shadow)">
    <rect class="frame" x="48" y="142" width="600" height="390" rx="18"/>
    <path class="line" d="M 592 142 V 532" opacity=".45"/>
    <g transform="translate(552 165)">
      <path class="icon" d="M2 8V2h6M18 8V2h-6M2 12v6h6M18 12v6h-6"/>
      <rect class="surface2" x="42" y="-7" width="38" height="34" rx="10"/>
      <path class="icon" d="M53 3h16v13H53zM55 15h12"/>
    </g>
    <g transform="translate(118 265)">
      <rect class="surface" width="460" height="50" rx="12"/>
      <rect class="icon" x="18" y="15" width="18" height="20" rx="3"/>
      <path class="icon" d="M23 20h8M23 25h8M23 30h5"/>
      <text class="text body" x="52" y="31">审阅</text>
      <text class="muted small" x="404" y="31">⌃⇧G</text>
      <rect class="surface" y="58" width="460" height="50" rx="12"/>
      <rect class="icon" x="18" y="73" width="18" height="20" rx="4"/>
      <path class="icon" d="M23 79l4 4-4 4M29 87h3"/>
      <text class="text body" x="52" y="89">终端</text>
      <rect class="surface" y="116" width="460" height="50" rx="12"/>
      <circle class="icon" cx="27" cy="141" r="10"/>
      <path class="icon" d="M17 141h20M27 131c4 4 4 16 0 20M27 131c-4 4-4 16 0 20"/>
      <text class="text body" x="52" y="147">浏览器</text>
      <text class="muted small" x="410" y="147">⌘T</text>
      <rect class="surface" y="174" width="460" height="50" rx="12"/>
      <path class="icon" d="M17 195h8l3 3h11v15H17z"/>
      <text class="text body" x="52" y="205">文件</text>
      <text class="muted small" x="410" y="205">⌘P</text>
    </g>
  </g>
  <text class="muted small" x="48" y="556">入口组宽 460 · 行高 50 · 间距 8 · 圆角 12 · 垂直中心略偏上</text>

  <!-- B: Tabs and terminal -->
  <text class="label" x="690" y="124">B · 多标签与终端</text>
  <g filter="url(#shadow)">
    <rect class="frame" x="690" y="142" width="862" height="390" rx="18"/>
    <line class="line" x1="690" y1="198" x2="1552" y2="198"/>
    <rect class="surface" x="714" y="152" width="232" height="38" rx="12"/>
    <rect class="icon" x="730" y="161" width="20" height="20" rx="4"/>
    <path class="icon" d="M736 167l4 4-4 4M742 175h3"/>
    <text class="text body" x="762" y="178">dasCowork</text>
    <text class="muted" x="919" y="178" font-size="20">×</text>
    <rect class="surface" x="954" y="152" width="38" height="38" rx="12"/>
    <text class="text" x="964" y="179" font-size="26">＋</text>
    <g transform="translate(1462 162)">
      <path class="icon" d="M0 6V0h6M16 6V0h-6M0 10v6h6M16 10v6h-6"/>
      <rect class="surface2" x="34" y="-8" width="38" height="34" rx="10"/>
      <path class="icon" d="M45 2h16v13H45zM47 14h12"/>
    </g>
    <text class="mono body" x="714" y="232">(base) nallylin@MacBook-Pro dasCowork %</text>
    <text class="mono body" x="714" y="262">█</text>
    <g filter="url(#shadow)">
      <rect fill="#2b2b2b" stroke="#444" x="1002" y="204" width="300" height="174" rx="16"/>
      <text class="text body" x="1032" y="244">▣　终端</text>
      <text class="text body" x="1032" y="290">◎　浏览器</text>
      <text class="muted small" x="1242" y="290">⌘T</text>
      <text class="text body" x="1032" y="336">▱　文件</text>
      <text class="muted small" x="1242" y="336">⌘P</text>
    </g>
  </g>
  <text class="muted small" x="690" y="556">标签栏高 56 · 标签高 38 · 左右内边距 24 · 标签间距 8 · 活动标签使用 muted surface</text>

  <!-- C: File workspace -->
  <text class="label" x="48" y="610">C · 文件工作区</text>
  <g filter="url(#shadow)">
    <rect class="frame" x="48" y="630" width="910" height="500" rx="18"/>
    <line class="line" x1="48" y1="686" x2="958" y2="686"/>
    <line class="line" x1="48" y1="740" x2="958" y2="740"/>
    <line class="line" x1="638" y1="740" x2="638" y2="1130"/>
    <rect class="surface" x="64" y="640" width="222" height="38" rx="12"/>
    <text class="text body" x="84" y="666">▯　.gitmodules</text>
    <text class="muted" x="258" y="666" font-size="20">×</text>
    <text class="text" x="304" y="668" font-size="25">＋</text>
    <text class="muted small" x="72" y="718">dasCowork　›　</text>
    <text class="text small" x="170" y="718">.gitmodules</text>
    <rect class="surface2" x="836" y="696" width="96" height="34" rx="10"/>
    <text class="text small" x="856" y="718">打开　⌄</text>
    <text class="muted mono" x="72" y="780" font-size="15">1　[submodule "codex"]</text>
    <text class="muted mono" x="72" y="812" font-size="15">2　　path = codex</text>
    <text class="muted mono" x="72" y="844" font-size="15">3　　url = https://github.com/example/codex.git</text>
    <rect fill="#1c1c1c" stroke="#353535" x="654" y="756" width="288" height="38" rx="11"/>
    <text class="muted body" x="676" y="781">⌕　筛选文件…</text>
    <g class="text body">
      <text x="676" y="832">⌄　desktop-app</text>
      <text x="696" y="870">⌄　src</text>
      <text x="716" y="908">›　renderer</text>
      <text x="676" y="946">›　docs</text>
      <rect class="surface2" x="664" y="966" width="266" height="40" rx="9"/>
      <text x="680" y="992">◆　.gitmodules</text>
      <text x="676" y="1038">M　AGENTS.md</text>
      <text x="676" y="1078">M　DESIGN.md</text>
    </g>
  </g>
  <text class="muted small" x="48" y="1154">内容 65% / 文件树 35% · 树最小宽 260 · 两层顶部栏 56 + 54 · 选中行高 40</text>

  <!-- D: Browser workspace -->
  <text class="label" x="1000" y="610">D · 浏览器工作区</text>
  <g filter="url(#shadow)">
    <rect class="frame" x="1000" y="630" width="552" height="236" rx="18"/>
    <line class="line" x1="1000" y1="686" x2="1552" y2="686"/>
    <line class="line" x1="1000" y1="734" x2="1552" y2="734"/>
    <rect class="surface" x="1016" y="640" width="192" height="38" rx="12"/>
    <text class="text body" x="1036" y="666">◎　新标签页</text>
    <text class="muted" x="1182" y="666" font-size="20">×</text>
    <text class="text" x="1224" y="668" font-size="25">＋</text>
    <text class="muted" x="1022" y="718" font-size="24">‹　›　↻</text>
    <text class="muted body" x="1226" y="718">输入 URL</text>
    <text class="muted" x="1520" y="718" font-size="22">⋮</text>
    <circle class="icon" cx="1276" cy="786" r="18"/>
    <path class="icon" d="M1258 786h36M1276 768c7 7 7 29 0 36M1276 768c-7 7-7 29 0 36"/>
    <text class="text title" x="1224" y="830">开始浏览</text>
    <text class="muted small" x="1198" y="854">输入 URL 以打开页面</text>
  </g>
  <text class="muted small" x="1000" y="890">导航栏高 48 · 地址输入居中 · 页面区域由 WebContentsView 填充</text>

  <!-- E: Review workspace -->
  <text class="label" x="1000" y="936">E · 审阅工作区</text>
  <g filter="url(#shadow)">
    <rect class="frame" x="1000" y="954" width="552" height="176" rx="18"/>
    <line class="line" x1="1000" y1="1006" x2="1552" y2="1006"/>
    <line class="line" x1="1000" y1="1050" x2="1552" y2="1050"/>
    <line class="line" x1="1358" y1="1050" x2="1358" y2="1130"/>
    <rect class="surface" x="1016" y="962" width="164" height="36" rx="12"/>
    <text class="text body" x="1034" y="987">▣　审阅</text>
    <text class="muted" x="1154" y="987" font-size="20">×</text>
    <text class="text" x="1196" y="990" font-size="25">＋</text>
    <text class="text body" x="1018" y="1036">未暂存　⌄</text>
    <text class="green body" x="1122" y="1036">+12</text>
    <text class="red body" x="1160" y="1036">-4</text>
    <rect class="surface2" x="1432" y="1014" width="104" height="30" rx="10"/>
    <text class="text small" x="1448" y="1034">提交或推送</text>
    <rect fill="#173528" x="1016" y="1064" width="326" height="44" rx="7"/>
    <text class="mono green small" x="1034" y="1091">+ const workspace = openTab()</text>
    <rect class="surface2" x="1372" y="1062" width="166" height="36" rx="8"/>
    <text class="text small" x="1386" y="1085">right-workspace.tsx</text>
    <text class="green small" x="1512" y="1085">M</text>
  </g>
  <text class="muted small" x="1000" y="1154">Diff 68% / 变更树 32% · Git 操作留在内容工具栏，通用关闭/新增只属于顶栏</text>
</svg>
